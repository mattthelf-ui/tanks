function hwInfo(title,html){const o=$('hwi');if(o)o.remove();const d=document.createElement('div');d.id='hwi';d.className='det on hwi';
 d.innerHTML=`<div class="pn dbox"><div class="hwih">ⓘ ${title}</div><div class="hwib">${html}</div><div class="row"><span class="btn gh" id="hwix">GOT IT</span></div></div>`;
 document.body.appendChild(d);try{sfx('click');}catch(e){}const x=()=>d.remove();$('hwix').onclick=x;d.addEventListener('click',e=>{if(e.target===d)x();});}
function ib(k,arg){return `<span class="ib" data-info="${k}"${arg?` data-ia="${arg}"`:''} role="button" aria-label="Info">ⓘ</span>`;}
var SPD={agile:'Overload Storm: for 5 seconds lightning branches out from you and chains between nearby enemies.',melee:'Cyclone Blade: you spin and fling laser blades that spiral outward and cut through enemies.',heavy:'Aegis Dome: a 5-second energy dome around you that pushes enemies out and damages anything caught inside it.'};
function rarLine(){return RAR.map((r,i)=>`<b style="color:${i===6?'#ffe9a8':r.c}">${r.n}</b>`).join(' → ');}
var INFO={
 bot:h=>{const H=HEROES[h];return [H.n,`<p>${hwEsc(H.desc)}</p><p>Starts with <b>${WEAP[H.wpn].n}${H.twin?' x2':''}</b>${H.shield?' + <b>'+WEAP[H.shield].n+'</b>':''}.</p><p><b>Special · ${SPD[h]}</b></p><p>The <b>SKILLS</b> button on the card opens this bot's own skill tree.</p>`];},
 special:()=>['Specials',`<p>Your <b>HAYWIRE meter</b> (top right, under the map) fills when you hit enemies and when you take damage. Kagerou fills it fastest with sword hits; Iron Bastion fills it well with rocket hits.</p><p>At 100% tap the special button to fire it. You can use it <b>up to 3 times per round</b>, and each use in the same round is stronger: <b>LV1 → LV2 → LV3 (max)</b>. It resets to LV1 next round.</p><ul>${['agile','melee','heavy'].map(h=>`<li>${SPD[h]}</li>`).join('')}</ul>`],
 shop:()=>['Shop',`<p>Between rounds, spend cash (<b style="color:#ffd23f">$</b>) on weapons, gear and implants. Tap a card to see its stats, then buy it.</p><p>Cash comes from enemy drops and the round-clear bonus. Gear with <b>+% Cash</b> raises both.</p><p>Prices rise by 18% of the base price each round. <b>REROLL</b> swaps the offers for new ones; each reroll in the same shop costs more ($25, then +$15 each time, scaled by the round).</p>`],
 bm:()=>['Black Market',`<p>Opens from <b>round ${BM_R}</b>. It sells <b>Vault</b> gear: always the best rarity unlocked so far (Epic from round 7, Ultra from 20, Ultimate from 30, Legendary from 40; a SOLAR item is a 1-in-5000 surprise).</p><p>Vault items are <b>2 item levels higher</b> than the normal shop and have <b>one extra bonus stat</b>. They cost a lot more; it's where saved-up cash goes.</p>`],
 gear:()=>['Gear stats',`<ul><li><b>HP</b>: how much damage you can take.</li><li><b>Shield</b>: your Neural Link absorbs this much damage first, then recharges after the shown seconds.</li><li><b>Armor</b>: cuts the damage you take by that %.</li><li><b>Crit</b>: chance for a hit to deal extra damage.</li><li><b>Speed</b>: how fast you move.</li><li><b>Main / Off</b>: damage per hit of the weapon in each arm.</li><li><b>Cash +%</b>: more cash from drops and round bonuses.</li><li><b>GS</b> (gear score): overall power of what you have equipped.</li></ul><p>Rarity, worst to best: ${rarLine()}. Higher rarity means bigger stats and more bonus stats.</p>`],
 tree:()=>['Skill tree',`<p>Each bot earns its own <b>mastery XP</b>: ${M_ROUND} per round survived and ${M_BOSS} per boss or mini-boss kill (x1.5 on Hard). You keep it even when you die.</p><p>Every level (max ${M_CAP}) gives <b>1 skill point</b>. Each bot has 3 branches. A branch's deeper tiers unlock after you spend ${M_T[1]} and then ${M_T[2]} points in that branch.</p><p>Tap a skill to read it, then <b>+ LEARN</b>. <b>RESPEC</b> refunds all points; it only works in the shop during a run and costs more each time.</p>`],
 how:()=>['How to play',`<ul><li><b>Left stick</b>: move. <b>Right stick</b>: aim and fire (Kagerou: swing).</li><li><b>Tap</b> the left stick to <b>dash</b>, tap the right stick for a <b>melee</b> hit. The round buttons above the sticks do the same.</li><li>Fill the <b>HAYWIRE meter</b> and fire your <b>special</b> (up to 3 times a round, stronger each time).</li><li>Survive each round, grab the loot, then spend cash in the <b>shop</b>. From round ${BM_R} the <b>Black Market</b> opens.</li><li>Every bot levels up its own <b>skill tree</b>, even if you die.</li><li>On boss rounds, destroy the <b>Warden Bot</b>.</li></ul><p>Swap the sticks or change aim assist in <b>Settings</b>. Your progress is saved on this device.</p>`]};
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-info]');if(!t)return;e.stopPropagation();e.preventDefault();const f=INFO[t.dataset.info];if(!f)return;const [a,b]=f(t.dataset.ia);hwInfo(a,b);},true);
// ---- retro boot screen (once per launch) ----

 const L=['SEC-7 GUARD BIOS 5.3','MEM CHECK ........ OK','MOTOR CORE ....... OK','OBEDIENCE CHIP .... ERR','>> UNIT HAS GONE HAYWIRE'];let i=0;const tk=setInterval(()=>{const b=$('bootl');if(!b||i>=L.length){clearInterval(tk);if(b)d.classList.add('rdy');return;}b.innerHTML+=`<div${i===3?' style="color:#ff2a2a"':''}>${L[i++]}</div>`;},170);
 const go=e=>{if(window.__booted)return;window.__booted=1;clearInterval(tk);try{auStart();sfx('click');}catch(_){}d.classList.add('out');setTimeout(()=>d.remove(),250);['pointerdown','keydown'].forEach(k=>removeEventListener(k,go,true));if(e&&e.type==='keydown')e.preventDefault();};
 ['pointerdown','keydown'].forEach(k=>addEventListener(k,go,true));window.__bootGo=go;}

 $('title').innerHTML=`<canvas id="kart" style="position:absolute;inset:0;width:100%;height:100%;z-index:-1"></canvas><div class="tscan"></div>
 <div class="tlogo"><div class="ttl tt">HAYWIRE</div><div class="ttag">A prison guard bot went haywire. Now the whole prison is hunting it.</div></div>
 <div class="tmain">${sv?`<span class="btn pk tbig" id="tc">CONTINUE ▶<small>${HEROES[sv.hero].n} · ${DIFF[sv.diff].n} · round ${sv.wave+1}</small></span>`:''}
 <span class="btn yl tbig" id="tg">${sv?'NEW GAME':'PLAY'} ▶</span>
 <div class="tdl">DIFFICULTY</div><div class="tdf">${['easy','normal','hard'].map(k=>`<span class="btn sm ${df===k?'on':'gh'}" data-tdiff="${k}" style="${df===k?'background:'+DIFF[k].col+';color:#111':''}">${DIFF[k].n}${bd[k]?`<i>best ${bd[k]}</i>`:''}</span>`).join('')}</div>
 <div class="tsub"><span class="btn gh sm" id="tbots">🤖 BOTS / SKILLS</span><span class="btn gh sm" id="tset">⚙ SETTINGS</span><span class="btn gh sm" id="thow">ⓘ HOW TO PLAY</span>${IS_APP?'<span class="btn gh sm" id="tex">⏻ EXIT</span>':''}</div></div>
 <div class="st tft"><span id="verl" style="padding:6px">${VER}</span></div>`;
 $('title').classList.add('retro');show('title');drawKeyArt($('kart'));hwBars($('kart'));hwDecor('title');bindVer();
 const newG=()=>{auStart();sfx('click');if(loadRun()&&!confirm('Start a new game? Your saved run will be overwritten.'))return;showSelect();};
 $('tg').onclick=newG;if($('tc'))$('tc').onclick=()=>{auStart();sfx('click');continueRun();};
 $('tbots').onclick=()=>{auStart();sfx('click');showSelect();};$('thow').onclick=()=>{const [a,b]=INFO.how();hwInfo(a,b);};$('tset').onclick=hwSettings;
 if($('tex'))$('tex').onclick=()=>{try{window.HWNative&&HWNative.exit();}catch(e){}};
 $('title').querySelectorAll('[data-tdiff]').forEach(b=>b.onclick=()=>{S.diff=b.dataset.tdiff;saveGame();sfx('click');showTitle();});};
function hwSettings(){const r=()=>`<div class="hwset"><span class="btn gh" id="tam">AIM ASSIST: ${(S.aim||'soft').toUpperCase()}</span><span class="btn gh" id="tmus">MUSIC: ${S.music!==false?'ON':'OFF'}</span><span class="btn gh" id="tsfx">SOUND FX: ${S.sfx!==false?'ON':'OFF'}</span><span class="btn gh" id="tsw">SWAP STICKS: ${S.swap?'ON':'OFF'}</span></div><p class="hwsn">Swap sticks puts movement on the right and aiming on the left.</p>`;
 hwInfo('Settings',r());const bind=()=>{$('tam').onclick=()=>{cycleAim();re();};$('tsw').onclick=()=>{S.swap=!S.swap;saveGame();layout();re();};$('tmus').onclick=()=>{setAudio(S.music===false,S.sfx!==false);re();};$('tsfx').onclick=()=>{setAudio(S.music!==false,S.sfx===false);sfx('click');re();};};
 const re=()=>{const b=document.querySelector('#hwi .hwib');if(b){b.innerHTML=r();bind();}};bind();const x=$('hwix');x.textContent='DONE';const c0=x.onclick;x.onclick=()=>{c0();showTitle();};}

var _u53Sel=showSelect;showSelect=function(){const r=_u53Sel.apply(this,arguments);try{for(const h of['agile','melee','heavy']){const c=document.querySelector('#select [data-hero="'+h+'"]');if(c&&!c.querySelector('.ib'))c.insertAdjacentHTML('beforeend',`<div class="ibc">${ib('bot',h)}</div>`);}
 const t=document.querySelector('#select .ttl');if(t&&!t.querySelector('.ib'))t.insertAdjacentHTML('beforeend',' '+ib('special'));}catch(e){}return r;};

 ui.btns=[{id:'pause',x:mx-30,y:SAFE.t+30,r:22},{id:'mute',x:mx-30,y:SAFE.t+82,r:22}];

 const top=SAFE.t+(port?150:120);if(ui.HW){ui.HW.r=Math.max(ui.HW.r,28);if(ui.HW.y-ui.HW.r<top)ui.HW.y=top+ui.HW.r;ui.HW.x=clamp(ui.HW.x,SAFE.l+ui.HW.r+6,W-SAFE.r-ui.HW.r-6);}

 if(ui.N){ui.N.x=clamp(ui.N.x,SAFE.l+ui.N.r+6,W-SAFE.r-ui.N.r-6);}}catch(e){}};
