};
function auCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return c;}
function auStart(){
 if(AU.muted)return;
 if(AU.ctx){if(AU.ctx.state!=='running')AU.ctx.resume();return;}
 try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch(e){}

 AU.mus=c.createGain();AU.mus.gain.value=AU.musOn?.25:0;AU.mus.connect(AU.mg);
 AU.sfx=c.createGain();AU.sfx.gain.value=AU.sfxOn?.55:0;AU.sfx.connect(AU.mg);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=nb;

 const T=TRACKS[AU.cur],spb=60/T.bpm/4;if(AU.nt<c.currentTime-.2)AU.nt=c.currentTime+.03;
 while(AU.nt<c.currentTime+.12){auStep(T,AU.step,AU.nt,spb);AU.nt+=spb;AU.step++;}}

 if(T.h[st]==='x'||T.h[st]==='o')noise(t,T.h[st]==='o'?.18:.035,.13,'highpass',7500,M);

 if(T.g&&T.g[st]==='x'){[0,7,12].forEach(iv=>{const o=osc('sawtooth',mtof(root+12+iv)*(1+(Math.random()-.5)*.004),t,spb*1.3,.07,AU.dist);});}
 if(T.lead&&sec===1){const ch=T.mel[bar%T.mel.length][st];if(ch&&ch!=='.'){const n=T.key+T.sc[+ch];['square','sawtooth'].forEach((ty,i)=>{const o=osc(ty,mtof(n)*(i?1.004:1),t,spb*3,.06,M,.01);o.connect&&0;});const o2=osc('square',mtof(n),t,spb*2,.03,AU.dly);}}

}

 case'saber':{const o=osc('sawtooth',90,t,.22,.16,D,.01);o.frequency.exponentialRampToValueAtTime(260,t+.08);o.frequency.exponentialRampToValueAtTime(70,t+.22);const o2=osc('sine',180,t,.25,.12,D,.01);o2.frequency.linearRampToValueAtTime(420,t+.1);const f=noise(t,.18,.25,'bandpass',900,D,3);f.frequency.exponentialRampToValueAtTime(3500,t+.12);break;}
 case'click':osc('square',900,t,.03,.06,D);break;

 c.globalAlpha*=.35;c.fillStyle='#19e3ff';c.fill();c.globalAlpha=(.15+.25*f)*(.5+.5*Math.sin(t*3));c.lineWidth=1;for(let i=0;i<6;i++){const a=i*1.047+t*.6;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.stroke();}c.restore();}
function revHud(c,L,T,t){if(!(G.revMax>0))return;c.save();c.font='italic 900 15px system-ui';c.textAlign='left';c.lineWidth=3;c.strokeStyle='#05060a';const s='🔥 REVIVES '+G.rev+'/'+G.revMax;const fl=G.revFx!=null&&G.t-G.revFx<1&&Math.floor(G.t*10)%2;c.fillStyle=G.rev>0?(fl?'#fff':'#ff5a1f'):'#776';c.strokeText(s,L+200,T+42);c.fillText(s,L+200,T+42);c.restore();}
function shHud(c,L,T,t){revHud(c,L,T,t);if(!(G.shMax>0))return;const f=G.sh/G.shMax,z=nShield(S.eq.neural);c.save();c.transform(1,0,-.2,1,0,0);c.fillStyle='#05060a';c.fillRect(L+46,T+19,146,5);c.fillStyle=G.shFlash>0?'#fff':'#19e3ff';c.fillRect(L+46,T+19,146*f,5);
 if(f<1&&z){const k=Math.min(1,(G.t-(G.shHit||0))/z.cd);c.fillStyle='rgba(122,255,255,.35)';c.fillRect(L+46+146*f,T+19,146*(1-f)*k,5);}c.restore();}
// ---- v30: Phoenix Protocol set (revives) ----
var TEST_SET=true; // v30 testing: puts the full Phoenix set in inventory for new runs & loaded saves. Set false to remove.
function giveTestSet(){if(!TEST_SET||window.__noSet||!S||!S.inv)return;if(allItems().some(i=>i.set==='phoenix'))return;S.inv.push(...makeSet());}
var SETS={phoenix:{n:'Phoenix Protocol',c:'#ff5a1f',need:3,rev:2,pieces:{chest:'Phoenix Protocol Aegis',legs:'Phoenix Protocol Greaves',thrust:'Phoenix Protocol Wings'}}};
function makeSet(){const P=SETS.phoenix,o=[];for(const sl in P.pieces){const it=makeItem(sl,1,3);it.name=P.pieces[sl];it.set='phoenix';o.push(it);}return o;}
function setCount(k){let n=0;for(const s of SLOTS)if(S.eq[s]&&S.eq[s].set===k)n++;return n;}
function setRevives(){const P=SETS.phoenix;return setCount('phoenix')>=P.need?P.rev:0;}
function setLine(){const P=SETS.phoenix,n=setCount('phoenix');const own=n||allItems().some(i=>i.set==='phoenix');if(!own)return '';const on=n>=P.need;
 return `<div class="st" style="margin-top:6px;color:${P.c}"><b>🔥 ${P.n} ${n}/${P.need}</b> · ${P.need}-piece bonus: <b>${P.rev} revives per round</b> (revive at 40% HP)${on?' · <b>ACTIVE</b>':''}</div>`;}
function itemDesc(it){const d=itemDesc0(it);if(!it.set)return d;const P=SETS[it.set];return d+' · 🔥 '+P.n+' set ('+setCount(it.set)+'/'+P.need+'): '+P.need+' pieces = '+P.rev+' revives/round';}
function hwRevive(src){const p=G.p;if(window.__RC&&__RC.noRev)return false;if(!(G.rev>0))return false;G.rev--;p.hp=Math.max(1,Math.round(G.ps.hp*.4));p.inv=2;p.flash=.3;
 G.sh=G.shMax||0;G.shake=Math.max(G.shake,14);G.flashT=.25;G.hitstop=.12;G.revFx=G.t;sfx('level');sfx('boom',1.1);
 burst(p.x,p.y,'#ff5a1f',36,420,4);burst(p.x,p.y,'#ffd23f',24,300,3);part({k:'ring',x:p.x,y:p.y,life:.7,col:'#ff5a1f',sz:180});part({k:'ring',x:p.x,y:p.y,life:.5,col:'#fff',sz:110});
 for(const e of G.en){if(e.dead||e.spawn>0||e.type==='boss'||e.type==='mboss')continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<150){const u=(e.x-p.x)/(d||1),v=(e.y-p.y)/(d||1);e.kx+=u*500;e.ky+=v*500;}}
 G.bul=G.bul.filter(b=>b.pl||Math.hypot(b.x-p.x,b.y-p.y)>160);
 addTxt(p.x,p.y-30,(src==='DRONE'?'DRONE STRIKE · ':'')+'PHOENIX REVIVE!','#ff5a1f',24,1.4);G.banner={t:1.2,txt:'REVIVED',sub:G.rev+' revive'+(G.rev===1?'':'s')+' left this round'};return true;}
function revDraw(){if(G.revFx==null)return;const k=(G.t-G.revFx)/1.2;if(k<0||k>1)return;const p=G.p,c=cx;c.save();c.globalAlpha=1-k;c.strokeStyle='#ff5a1f';c.lineWidth=6*(1-k)+1;
 for(let i=0;i<6;i++){const a=i*1.047+G.t*3,r=30+k*90;c.beginPath();c.moveTo(p.x+Math.cos(a)*r*.4,p.y+Math.sin(a)*r*.4);c.quadraticCurveTo(p.x+Math.cos(a+.6)*r,p.y+Math.sin(a+.6)*r,p.x+Math.cos(a+1)*r*1.1,p.y+Math.sin(a+1)*r*1.1);c.stroke();}c.restore();}
// ---- v30: acid DoT on main weapon ----
function acidAdd(e,dmg,b){if(e.dead||e.type==='drone')return;const boss=e.type==='boss'||e.type==='mboss',a=dmg*(boss?.08:ACIDK);e.acC=Math.max(e.acC||0,a*3);e.ac=Math.min(e.acC,(e.ac||0)+a);
 if(R()<.7)burst(b.x,b.y,'#7dff3a',3,200,2);}
var ACIDK=.14,ACIDM=.88; // acid DoT share of main hit; main direct dmg trimmed to compensate
function acidTick(dt){for(const e of G.en){if(e.dead||!(e.ac>.05))continue;const d=Math.min(e.ac,Math.max(e.ac*.6,2)*dt);e.ac-=d;e.hp-=d;e.acA=(e.acA||0)+d;
 if(e.acA>=4){addTxt(e.x+rnd(-8,8),e.y-e.r-4,Math.round(e.acA),'#7dff3a',12,.5);e.acA=0;}if(R()<dt*6)part({k:'ring',x:e.x+rnd(-e.r,e.r)*.6,y:e.y+rnd(-e.r,e.r)*.6,life:.35,col:'#7dff3a',sz:8});
 if(e.hp<=0)killEnemy(e);}}
function acidDraw(e,t){if(!(e.ac>.3))return;const c=cx,k=Math.min(1,e.ac/12);c.save();c.globalAlpha=.25+.25*k;c.fillStyle='#5cff2a';c.beginPath();c.arc(e.x,e.y,e.r*1.15,0,6.283);c.fill();c.globalAlpha=.8;c.fillStyle='#b6ff7a';
 for(let i=0;i<3;i++){const ph=(t*1.6+i*.33+e.x*.003)%1;c.beginPath();c.arc(e.x+Math.sin(i*2.1+e.y)*e.r*.6,e.y+e.r*.4-ph*e.r*1.4,2+2*ph,0,6.283);c.fill();}c.restore();}
// ---- v31: ELECTRIFIER (replaces instant-kill drones from round 16) ----
var EZ_TICK=.3,EZ_TELE=1.2,EZ_LIVE=3,EZ_N=5;
function elecTick(dt){if(!G.ez)G.ez=[];const p=G.p;
 for(const e of G.en){if(e.dead||e.type!=='electro'||e.spawn>0)continue;if(e.ezT==null)e.ezT=rnd(1.5,3);e.ezT-=dt;
  if(e.ezT<=0&&Math.hypot(p.x-e.x,p.y-e.y)<520){e.ezT=EZ_TELE+EZ_LIVE+rnd(2.5,4);const tx=Math.floor(e.x/TILE),ty=Math.floor(e.y/TILE),px=Math.floor(p.x/TILE),py=Math.floor(p.y/TILE);
   const cxT=tx+clamp(px-tx,-2,2),cyT=ty+clamp(py-ty,-2,2);G.ez.push({x:(cxT-2)*TILE,y:(cyT-2)*TILE,s:EZ_N*TILE,t:0,dt:0,src:e});sfx('buzz',.8);}}
 for(const z of G.ez){z.t+=dt;if(z.t<EZ_TELE)continue;if(z.src&&z.src.dead&&z.t<EZ_TELE+.01){z.t=1e9;continue;}
  z.dt-=dt;if(z.dt>0)continue;z.dt=EZ_TICK;if(R()<.5)sfx('zap',.5);const dps=ezDps(),inZ=o=>o.x>z.x&&o.x<z.x+z.s&&o.y>z.y&&o.y<z.y+z.s;
  if(inZ(p))ezZap(dps*EZ_TICK);
  for(const o of G.en)if(!o.dead&&o.fac==='rogue'&&inZ(o))hwDmg(o,dps*EZ_TICK*1.5);}
 G.ez=G.ez.filter(z=>z.t<EZ_TELE+EZ_LIVE);}
function ezDps(){return 16*(G.wDmg||1);}
function elecDraw(t){if(!G.ez||!G.ez.length)return;const c=cx;c.save();
 for(const z of G.ez){if(z.t<EZ_TELE){const on=Math.floor(z.t*8)%2;c.globalAlpha=on?.55:.2;c.strokeStyle='#ffe23f';c.lineWidth=2;
   for(let i=0;i<=EZ_N;i++){c.beginPath();c.moveTo(z.x+i*TILE,z.y);c.lineTo(z.x+i*TILE,z.y+z.s);c.stroke();c.beginPath();c.moveTo(z.x,z.y+i*TILE);c.lineTo(z.x+z.s,z.y+i*TILE);c.stroke();}
   c.globalAlpha=on?.18:.06;c.fillStyle='#ffe23f';c.fillRect(z.x,z.y,z.s,z.s);c.globalAlpha=.9;c.fillStyle='#ffe23f';c.font='900 14px system-ui';c.textAlign='center';c.fillText('⚡ '+Math.max(0,EZ_TELE-z.t).toFixed(1),z.x+z.s/2,z.y-6);}
  else{const k=1-(z.t-EZ_TELE)/EZ_LIVE;c.globalAlpha=.22+.12*Math.sin(t*40);c.fillStyle='#7fe8ff';c.fillRect(z.x,z.y,z.s,z.s);c.globalAlpha=.85;c.strokeStyle='#fff8a0';c.lineWidth=3;c.strokeRect(z.x,z.y,z.s,z.s);
   c.lineWidth=2;for(let n=0;n<7;n++){c.strokeStyle=n%2?'#ffe23f':'#bff6ff';c.beginPath();let x=z.x+R()*z.s,y=z.y+R()*z.s;c.moveTo(x,y);for(let j=0;j<5;j++){x=clamp(x+rnd(-26,26),z.x,z.x+z.s);y=clamp(y+rnd(-26,26),z.y,z.y+z.s);c.lineTo(x,y);}c.stroke();}
   c.globalAlpha=.5*k;c.fillStyle='#fff';for(let n=0;n<6;n++)c.fillRect(z.x+R()*z.s,z.y+R()*z.s,3,3);}}
 c.restore();}
function ezZap(d){const p=G.p;if(G.hwImm>0||p.dashT>0||G.state!=='play'||(window.__RC&&__RC.god))return;d*=1-G.ps.armor;p.hurtT=G.t;d=shAbsorb(d);
 part({k:'star',x:p.x+rnd(-10,10),y:p.y+rnd(-10,10),life:.12,col:'#ffe23f',sz:22,a:R()*6});burst(p.x,p.y,'#bff6ff',3,180,2);if(R()<.6)sfx('zap',.4);
 if(d<=0)return;p.hp-=d;p.flash=.05;addTxt(p.x+rnd(-12,12),p.y-20,'-'+Math.max(1,Math.round(d)),'#ffe23f',13,.45);
 if(p.hp<=0&&!hwRevive()){p.hp=0;G.state='dead';G.stT=0;sfx('boom',1.4);burst(p.x,p.y,'#ffe23f',40,420,4);addTxt(p.x,p.y-26,'ELECTRIFIED','#ffe23f',22,1.2);endRun(false);}}
